apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: spotify-memory
spec:
  serviceName: neo4j-service
  replicas: 1
  selector:
    matchLabels: { app: neo4j }
  template:
    metadata:
      labels: { app: neo4j }
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26-community
          ports:
            - containerPort: 7687
            - containerPort: 7474
          env:
            - name: NEO4J_AUTH
              value: "neo4j/password123"
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
  volumeClaimTemplates:
    - metadata: { name: neo4j-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j-service
  namespace: spotify-memory
spec:
  selector: { app: neo4j }
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
