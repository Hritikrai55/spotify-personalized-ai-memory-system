# Replace placeholder values before applying, or generate with:
#   kubectl create secret generic memory-secrets --namespace spotify-memory \
#     --from-literal=GROQ_API_KEY=xxx --from-literal=NEO4J_PASSWORD=xxx
apiVersion: v1
kind: Secret
metadata:
  name: memory-secrets
  namespace: spotify-memory
type: Opaque
stringData:
  GROQ_API_KEY: "replace-with-your-groq-key"
  NEO4J_PASSWORD: "password123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-config
  namespace: spotify-memory
data:
  GROQ_MODEL: "llama-3.3-70b-versatile"
  NEO4J_URI: "bolt://neo4j-service:7687"
  NEO4J_USER: "neo4j"
  QDRANT_URL: "http://qdrant-service:6333"
  QDRANT_COLLECTION: "spotify_memory"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  KAFKA_EVENTS_TOPIC: "interaction-events"
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  MAX_CONTEXT_MEMORIES: "8"
